name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy
# validation, and allow manual testing through the repository's "Actions" tab.
on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

jobs:
    # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
    copilot-setup-steps:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "22"

            - name: Set up Bun
              uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
              with:
                  bun-version: 1.3.11

            - name: Set up Python
              uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
              with:
                  python-version: "3.12"
                  cache: "pip"
                  cache-dependency-path: python/requirements.txt

            - name: Install JavaScript dependencies
              run: bun install --frozen-lockfile

            - name: Install Python test dependencies
              run: python -m pip install -r python/requirements.txt

            - name: Build openclaude
              run: bun run build

            - name: Install openclaude CLI globally
              # Install from local source so the agent can use `openclaude` in PATH.
              # --ignore-scripts skips @vscode/ripgrep's binary download (not needed
              # for agent work; the runtime falls back to the system `rg`).
              run: npm install -g . --ignore-scripts
